name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-engine/requirements.txt
      - run: npm ci
      - run: pip install -r ml-engine/requirements.txt
      - run: npm test
      - run: npm audit --audit-level=high
      - run: python -m venv .venv-audit
      - run: .venv-audit/bin/python -m pip install pip-audit
      - run: .venv-audit/bin/pip-audit -r ml-engine/requirements.txt
      - run: node scripts/record-security-audit.mjs
      - run: npm run quality:report
      - run: npm run build
      - run: npm run lint --workspace=server
      - run: npm run lint --workspace=client
      - run: python verify_evidence.py
      - uses: actions/upload-artifact@v6
        with:
          name: ledgerlens-quality-scorecard
          path: |
            client/public/quality-scorecard.json
            client/public/quality-test-results.json
            client/public/quality-security-results.json
          if-no-files-found: error
          retention-days: 90
