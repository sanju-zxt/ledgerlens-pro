name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-engine/requirements.txt
      - run: npm ci
      - run: pip install -r ml-engine/requirements.txt
      - run: npm test
      - run: npm run build
      - run: npm run lint --workspace=server
      - run: python verify_evidence.py
