services:
  - type: web
    name: ledgerlens-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://ledgerlens-pro.vercel.app
      - key: DEMO_MODE_ENABLED
        value: "true"
      - key: DEMO_EMAIL
        sync: false
      - key: DEMO_PASSWORD_HASH
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: PAYPAL_PARTNER_APPROVED
        value: "false"
      - key: PAYPAL_PARTNER_MERCHANT_ID
        sync: false
      - key: PAYPAL_ATTRIBUTION_ID
        sync: false
      - key: PAYPAL_ONBOARDING_RETURN_URL
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ML_ENGINE_URL
        value: https://ledgerlens-ml.onrender.com
      - key: ML_ENGINE_API_KEY
        fromService:
          name: ledgerlens-ml
          type: web
          envVarKey: ML_ENGINE_API_KEY
  - type: web
    name: ledgerlens-ml
    runtime: python
    plan: free
    healthCheckPath: /health
    rootDir: ml-engine
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: ML_ENGINE_API_KEY
        generateValue: true
