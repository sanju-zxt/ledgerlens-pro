services:
  - type: web
    name: ledgerlens-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: http://localhost:3000
      - key: DEMO_MODE_ENABLED
        value: "true"
      - key: PAYPAL_ENV
        value: sandbox
      - key: ML_ENGINE_HOST
        fromService:
          name: ledgerlens-ml
          type: web
          property: host
      - key: ML_ENGINE_PORT
        fromService:
          name: ledgerlens-ml
          type: web
          property: port
  - type: web
    name: ledgerlens-ml
    runtime: python
    plan: free
    rootDir: ml-engine
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
