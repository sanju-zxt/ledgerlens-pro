envVarGroups:
  - name: ledgerlens-ml-internal
    envVars:
      - key: ML_ENGINE_API_KEY
        generateValue: true

services:
  - type: web
    name: ledgerlens-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://ledgerlens-pro.vercel.app
      - key: DEMO_MODE_ENABLED
        value: "true"
      - key: PAYPAL_ENV
        value: sandbox
      - key: ML_ENGINE_URL
        value: https://ledgerlens-ml.onrender.com
      - fromGroup: ledgerlens-ml-internal
  - type: web
    name: ledgerlens-ml
    runtime: python
    plan: free
    rootDir: ml-engine
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - fromGroup: ledgerlens-ml-internal
